name: flutter_home_work
description: "HomeWork"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  logger: ^2.5.0

  # API
  dio: ^5.8.0+1
  retrofit: ^4.9.2
  json_annotation: ^4.9.0

  # L10n
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  equatable: ^2.0.7
  http_mock_adapter: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # API
  retrofit_generator: ^10.0.1
  build_runner: ^2.6.0
  json_serializable: ^6.10.0

  # L10n
  intl_utils: ^2.8.11

  # Assets
  flutter_gen_runner: ^5.8.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/colors.xml

flutter_gen:
  colors:
    inputs:
      - assets/colors.xml

flutter_intl:
  enabled: true


